controller_manager:
  ros__parameters:
    use_sim_time: false
    update_rate: 100  # Hz

    # List of controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # left_hand_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController
    
    # right_hand_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

# Joint State Broadcaster config
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

# Dual Arm
dual_arm_controller:
  ros__parameters:
    joints:
      - j11
      - j12
      - j13
      - j14
      - j15
      - j16
      - j17
      - f18
      - j21
      - j22
      - j23
      - j24
      - j25
      - j26
      - j27
      - f28
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    action_monitor_rate: 20.0

# Head - Standard Position Mode (OpMode 3) on XL430s
head_controller:
  ros__parameters:
    joints:
      - j31
      - j32
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    action_monitor_rate: 20.0

