# ros2_controllers.yaml
# ---------------------
# Configuration for ros2_control controller_manager

controller_manager:
  ros__parameters:
    # General ros2_control settings
    use_sim_time: false
    update_rate: 100  # Hz

    # List of controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Individual controller configurations
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

dual_arm_controller:
  ros__parameters:
    joints:
      - j11
      - j12
      - j13
      - j14
      - j15
      - j16
      - j17
      - j21
      - j22
      - j23
      - j24
      - j25
      - j26
      - j27
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    action_monitor_rate: 20.0

left_arm_controller:
  ros__parameters:
    joints:
      - j21
      - j22
      - j23
      - j24
      - j25
      - j26
      - j27
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    action_monitor_rate: 20.0

right_arm_controller:
  ros__parameters:
    joints:
      - j11
      - j12
      - j13
      - j14
      - j15
      - j16
      - j17
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    action_monitor_rate: 20.0