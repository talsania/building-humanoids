# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    use_sim_time: False
    update_rate: 100  # Hz

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    # head_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


    # left_hand_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


    # right_hand_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

dual_arm_controller:
  ros__parameters:
    joints:
      - j11
      - j12
      - j13
      - j14
      - j15
      - j16
      - j17
      - j21
      - j22
      - j23
      - j24
      - j25
      - j26
      - j27
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
