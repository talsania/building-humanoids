# ros2_controllers.yaml
# ---------------------
# Configuration for ros2_control controller_manager

controller_manager:
  ros__parameters:
    # General ros2_control settings
    use_sim_time: false # Set to true if using Gazebo sim time, false for hardware
    update_rate: 100  # Hz

    # List of controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Add controllers for the grippers
    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController # Or gripper_controllers/GripperActionController
      # type: "gripper_controllers/GripperActionController" # Alternative for action interface

    right_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController # Or gripper_controllers/GripperActionController
      # type: "gripper_controllers/GripperActionController" # Alternative for action interface

    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    
# Individual controller configurations
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

dual_arm_controller:
  ros__parameters:
    joints:
      - j11
      - j12
      - j13
      - j14
      - j15
      - j16
      - j17
      - j21
      - j22
      - j23
      - j24
      - j25
      - j26
      - j27
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true # Consider if this is desired
    action_monitor_rate: 20.0
    # Gains - important for hardware
    # gains:
    #   j11: {p: 100.0, i: 0.01, d: 10.0, i_clamp: 1.0, ff_velocity_scale: 1.0}
    #   ... (for all dual_arm_controller joints)

# --- New Gripper Controller Configurations ---
left_hand_controller:
  ros__parameters:
    joints:
      - f28 # The single conceptual joint for the left gripper
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity # if available from your hardware interface
    # If using JointTrajectoryController, you might need gains, though for simple 1-DOF grippers they might be less critical
    # If using GripperActionController, parameters are different (e.g., goal_tolerance)
    # gains: # Example if using JTC
    #   left_gripper_joint: {p: 50.0, i: 0.0, d: 1.0}

right_hand_controller:
  ros__parameters:
    joints:
      - f18 # The single conceptual joint for the right gripper
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity # if available from your hardware interface
    # gains: # Example if using JTC
    #   right_gripper_joint: {p: 50.0, i: 0.0, d: 1.0}

