# This is the top-level key for OMPL parameters within the move_group node's namespace.
ompl:
  # Default planning time for OMPL planners
  planning_time: 10.0 # seconds

  # Default scaling factors for velocity and acceleration
  # These are applied if not overridden by the motion request.
  max_velocity_scaling_factor: 0.1
  max_acceleration_scaling_factor: 0.1

  # Simplify solutions by default - this is a global OMPL setting
  simplify_solutions: true

  # Available planner configurations
  # These are definitions of planners that can be selected per group.
  planner_configs:
    RRTConnectkConfigDefault:
      type: geometric::RRTConnect
      range: 0.0               # Max motion added to tree. If 0.0, default is computed.
      goal_bias: 0.05          # When close to goal, try to connect to goal directly.
      # Projection an string like "x", "y", "z". Only works for 3D.
      # projection_evaluator: joints(joint1,joint2) 
      # Other RRTConnect specific parameters can be added here if needed.

    RRTstarkConfigDefault:
      type: geometric::RRTstar
      range: 0.0
      goal_bias: 0.05
      delay_collision_checking: true
      # Other RRTstar specific parameters

    # Add other planner config definitions as needed (e.g., PRM, EST, etc.)

  # --- Planning Group Specific Configurations ---
  # For each planning group in your SRDF, you can specify:
  # - default_planner_config: The planner to use if not specified in a request.
  # - planner_configs: A list of planners available for this group.
  # - projection_evaluator: (Less common for general groups)
  # - longest_valid_segment_fraction: (Advanced parameter)

  # Example for your 'dual_arm' group
  dual_arm:
    default_planner_config: RRTConnectkConfigDefault
    planner_configs:
      - RRTConnectkConfigDefault
      - RRTstarkConfigDefault
    # projection_evaluator: joints(left_arm_joint1,right_arm_joint1) # Example if useful

  # Example for your 'left_arm' group
  left_arm:
    default_planner_config: RRTConnectkConfigDefault
    planner_configs:
      - RRTConnectkConfigDefault
      - RRTstarkConfigDefault

  # Example for your 'right_arm' group
  right_arm:
    default_planner_config: RRTConnectkConfigDefault
    planner_configs:
      - RRTConnectkConfigDefault
      - RRTstarkConfigDefault

  # If you have an 'all_manipulators' group or other groups, configure them similarly.
  # all_manipulators:
  #   default_planner_config: RRTConnectkConfigDefault
  #   planner_configs:
  #     - RRTConnectkConfigDefault
  #     - RRTstarkConfigDefault