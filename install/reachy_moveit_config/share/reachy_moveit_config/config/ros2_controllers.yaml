# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    use_sim_time: False
    update_rate: 1000  # Hz

    dual_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    # left_gripper_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


    # right_gripper_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

dual_arm_controller:
  ros__parameters:
    joints:
      - l_shoulder_pitch
      - l_shoulder_roll
      - l_arm_yaw
      - l_elbow_pitch
      - l_forearm_yaw
      - l_wrist_pitch
      - l_wrist_roll
      - r_shoulder_pitch
      - r_shoulder_roll
      - r_arm_yaw
      - r_elbow_pitch
      - r_forearm_yaw
      - r_wrist_pitch
      - r_wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

head_controller:
  ros__parameters:
    joints:
      - neck_roll
      - neck_pitch
      - neck_yaw
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# left_gripper_controller:
#   ros__parameters:
#     joints:
#       - l_gripper
#     command_interfaces:
#       - position
#     state_interfaces:
#       - position
#       - velocity

# right_gripper_controller:
#   ros__parameters:
#     joints:
#       - r_gripper
#     command_interfaces:
#       - position
#     state_interfaces:
#       - position
#       - velocity

    state_publish_rate: 200.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
