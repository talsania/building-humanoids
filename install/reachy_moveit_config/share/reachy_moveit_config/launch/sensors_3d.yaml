sensors:
  - default_sensor
  - kinect_depthimage
default_sensor:
  far_clipping_plane_distance: 1.0
  filtered_cloud_topic: filtered_cloud
  image_topic: /camera/camera/depth/color/points
  max_update_rate: 1.0
  near_clipping_plane_distance: 0.02
  padding_offset: 0.02
  padding_scale: 1.0
  queue_size: 5
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  shadow_threshold: 0.2
kinect_depthimage:
  far_clipping_plane_distance: 1.0
  filtered_cloud_topic: filtered_cloud
  image_topic: /head_mount_kinect/depth_registered/image_raw
  max_update_rate: 1.0
  near_clipping_plane_distance: 0.02
  padding_offset: 0.03
  padding_scale: 4.0
  queue_size: 5
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  shadow_threshold: 0.2

# ros2 run tf2_ros static_transform_publisher 0 0 0.1 0 0 0 head camera_link